<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mates per a la vida · 4t ESO</title>
<style>
:root{
  --fs:20px;
  --bg:#f6f4ee; --card:#ffffff; --ink:#1d2730; --muted:#55606b; --line:#d8d2c4;
  --accent:#2b6a8a; --accent-ink:#ffffff; --soft:#e7f0f4;
  --ok:#256b2c; --okbg:#e6f3e6; --no:#8a4b00; --nobg:#fff1dc; --orange:#b85f00;
}
body.contrast{
  --bg:#ffffff; --card:#ffffff; --ink:#000000; --muted:#1a1a1a; --line:#000000;
  --accent:#003e8a; --soft:#e6edfb; --ok:#004d00; --okbg:#dcffdc; --no:#6b2b00; --nobg:#ffefcc; --orange:#8a3d00;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Verdana,Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.6}
body.spaced{letter-spacing:.04em;word-spacing:.15em;line-height:1.95}
button{font:inherit;cursor:pointer}
:focus-visible{outline:4px solid #f0b400;outline-offset:2px}

/* Capçalera */
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--line);
  display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;justify-content:space-between;padding:.45rem 16px}
.top h1{font-size:1rem;margin:0;flex:1 1 auto}
.tools{display:flex;flex-wrap:wrap;gap:.35rem}
.tbtn{background:var(--soft);color:var(--ink);border:2px solid var(--line);border-radius:.6rem;padding:.3rem .6rem;font-size:.8rem;min-height:44px}
.tbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tbtn.calm{background:#e3f1e4;border-color:#9cc59f}

main{max-width:900px;margin:0 auto;padding:1rem 16px 4rem}
h2{font-size:1.35rem;margin:.4rem 0 .6rem}
h3{font-size:1.1rem;margin:1rem 0 .5rem}
p{margin:.4rem 0 .8rem}
.muted{color:var(--muted)}

/* Inici */
.hello{background:var(--card);border:2px solid var(--line);border-radius:1rem;padding:1rem}
.tri{margin-top:1.4rem}
.tri h3{display:flex;align-items:center;gap:.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.8rem}
.ucard{display:flex;gap:.7rem;align-items:center;text-align:left;background:var(--card);color:var(--ink);
  border:2px solid var(--line);border-radius:1rem;padding:.8rem;min-height:90px;text-decoration:none}
.ucard:hover{border-color:var(--accent)}
.ucard .ic{font-size:2rem;line-height:1}
.ucard b{display:block;font-size:.95rem}
.ucard small{display:block;color:var(--muted);font-size:.75rem}
.ucard .prog{font-size:.75rem;color:var(--ok);font-weight:bold}

/* Unitat */
.uhead{display:flex;align-items:center;gap:.7rem}
.uhead .ic{font-size:2.4rem}
.steps{list-style:none;padding:0;margin:.8rem 0 1rem;display:flex;flex-wrap:wrap;gap:.35rem}
.steps button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:2rem;padding:.25rem .7rem;font-size:.75rem;min-height:44px}
.steps button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:bold}
.steps button.seen{border-color:var(--accent)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:1rem;padding:1rem 1.1rem}
.panel .big{font-size:1.15rem}
.stepnum{display:inline-block;font-size:.75rem;color:var(--muted);margin-bottom:.2rem}
.words{display:grid;gap:.6rem}
.word{border-left:6px solid var(--accent);background:var(--soft);padding:.5rem .8rem;border-radius:.4rem}
.word b{display:block}
.word .eg{font-family:inherit;color:var(--muted)}
ol.how{padding-left:0;list-style:none;counter-reset:h}
ol.how li{counter-increment:h;position:relative;padding:.5rem .5rem .5rem 3rem;margin:.4rem 0;background:var(--soft);border-radius:.6rem}
ol.how li::before{content:counter(h);position:absolute;left:.6rem;top:.45rem;width:1.8rem;height:1.8rem;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:.9rem}
.formula{display:inline-block;background:#fffbe6;border:2px dashed #c9a400;border-radius:.5rem;padding:.1rem .5rem;font-weight:bold}
body.contrast .formula{background:#fff;border-color:#000}
.fig{width:100%;max-width:560px;height:auto;display:block;margin:.8rem auto;color:var(--ink)}
.figrow{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center}
.figrow figure{margin:0;text-align:center;flex:1 1 160px;max-width:200px}
.figrow figcaption{font-size:.8rem}
.example{border:3px solid var(--accent);border-radius:1rem;padding:.8rem 1rem;background:var(--card)}
.example h3{margin-top:0}
.nav{display:flex;justify-content:space-between;gap:.6rem;margin-top:1rem}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:.7rem;padding:.6rem 1.1rem;min-height:48px;font-weight:bold}
.btn.sec{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.tblock{display:inline-block}

/* Exercicis */
.exs{display:grid;gap:1rem}
.ex{border:2px solid var(--line);border-radius:1rem;padding:.8rem 1rem;background:var(--card)}
.ex.done{border-color:var(--ok);background:var(--okbg)}
.ex .q{font-weight:bold;margin-bottom:.5rem}
.ex .q .n{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:.4rem;padding:0 .45rem;margin-right:.4rem}
.opts{display:flex;flex-wrap:wrap;gap:.5rem}
.opt{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:.7rem;padding:.5rem .9rem;min-height:48px;min-width:4rem}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.numrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.numrow input{font:inherit;width:7.5rem;padding:.4rem .5rem;border:2px solid var(--line);border-radius:.6rem;min-height:48px}
.small{font-size:.8rem}
.fb{margin-top:.5rem;padding:.4rem .7rem;border-radius:.6rem;display:none}
.fb.ok{display:block;background:var(--okbg);color:var(--ok);font-weight:bold}
.fb.no{display:block;background:var(--nobg);color:var(--no)}
.hint{display:none;margin-top:.4rem;padding:.4rem .7rem;border-left:5px solid #c9a400;background:#fffbe6;border-radius:.3rem}
body.contrast .hint{background:#fff;border-color:#000}
.hint.show{display:block}
.links{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
.linkbtn{background:none;border:2px dotted var(--muted);color:var(--ink);border-radius:.6rem;padding:.25rem .6rem;font-size:.8rem;min-height:44px}
.score{font-weight:bold;color:var(--ok)}

.remember li{margin:.4rem 0;font-weight:bold}
.fact{margin-top:1rem;background:var(--soft);border-radius:.8rem;padding:.7rem 1rem}
.fact b:first-child{display:block}

/* Programació per blocs */
.blocks{display:inline-block;font-size:.9rem;margin:.6rem 0}
.blk{background:#dbe9ff;border:2px solid #6b8fd1;border-radius:.4rem;padding:.25rem .6rem;margin:.25rem 0;color:#10264f}
.blk.loop{background:#ffe9c7;border-color:#d39b3a;color:#4a3000}
.blk.loop .blk{margin-left:1.2rem}
.blk.cond{background:#e4f5dc;border-color:#78b05a;color:#1f3d10}
.blk.cond .blk{margin-left:1.2rem}
.code{font-family:Consolas,"Courier New",monospace;background:var(--soft);padding:.4rem .6rem;border-radius:.4rem;display:block;white-space:pre;overflow-x:auto;font-size:.9rem}

.pascal{text-align:center;font-family:Consolas,monospace;line-height:1.7}
.pascal span{display:inline-block;min-width:2rem}

/* Emocions */
.feel{display:flex;flex-wrap:wrap;gap:.5rem}
.feel button{background:var(--card);border:2px solid var(--line);border-radius:1rem;padding:.5rem .8rem;min-height:56px;color:var(--ink)}
.feel button.sel{border-color:var(--accent);background:var(--soft)}
.feelmsg{margin-top:.6rem}

/* Guia docent */
table{border-collapse:collapse;width:100%;font-size:.78rem}
th,td{border:1px solid var(--line);padding:.35rem .45rem;vertical-align:top;text-align:left}
th{background:var(--soft)}
.tablewrap{overflow-x:auto}
details{background:var(--card);border:2px solid var(--line);border-radius:.8rem;padding:.5rem .9rem;margin:.6rem 0}
summary{font-weight:bold;cursor:pointer;min-height:44px;display:flex;align-items:center}
.guide li{margin:.3rem 0}

/* Racó de calma */
#calm{position:fixed;inset:0;background:rgba(232,242,235,.97);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:16px;text-align:center}
#calm[hidden]{display:none}
body.contrast #calm{background:#fff}
.breath{width:140px;height:140px;border-radius:50%;background:#9cc59f;animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.7)}50%{transform:scale(1.15)}}
#calmTxt{font-size:1.4rem;font-weight:bold}

.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem 1rem;border-radius:.6rem;font-size:.85rem;z-index:30}

@media (max-width:560px){
  :root{--fs:18px}
  .top h1{flex-basis:100%}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
@media print{
  .top,.nav,.steps,.links,#calm{display:none!important}
  body{background:#fff}
  .panel,.ex{break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <h1>📘 Mates per a la vida · 4t ESO</h1>
  <div class="tools" role="toolbar" aria-label="Eines">
    <button class="tbtn" id="bHome">🏠 Inici</button>
    <button class="tbtn" id="bSmaller" aria-label="Lletra més petita">A−</button>
    <button class="tbtn" id="bBigger" aria-label="Lletra més gran">A+</button>
    <button class="tbtn" id="bSpaced" aria-pressed="false">↔ Espai</button>
    <button class="tbtn" id="bContrast" aria-pressed="false">◐ Contrast</button>
    <button class="tbtn" id="bSpeak">🔊 Escolta</button>
    <button class="tbtn calm" id="bCalm">🌿 Pausa</button>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<div id="calm" hidden role="dialog" aria-modal="true" aria-labelledby="calmTxt">
  <div class="breath" aria-hidden="true"></div>
  <div id="calmTxt">Inspira…</div>
  <p>Respira a poc a poc.<br>Pots tornar quan estiguis a punt.</p>
  <button class="btn" id="bCalmOff">Ja estic millor ✔</button>
</div>

<script>
/* =========================================================
   FIGURES (SVG)
   ========================================================= */
function numberLine(){
  let s='<svg viewBox="0 0 560 110" class="fig" role="img" aria-label="Recta numèrica de menys 5 a 5. Hi ha marcats menys 2 i 3.">';
  s+='<text x="20" y="18" font-size="15" fill="currentColor">◀ més petit</text><text x="540" y="18" font-size="15" fill="currentColor" text-anchor="end">més gran ▶</text>';
  s+='<line x1="16" y1="60" x2="544" y2="60" stroke="currentColor" stroke-width="2"/>';
  for(let n=-5;n<=5;n++){const x=280+n*48;
    s+=`<line x1="${x}" y1="52" x2="${x}" y2="68" stroke="currentColor" stroke-width="2"/><text x="${x}" y="92" text-anchor="middle" font-size="18" fill="currentColor">${n<0?'−'+(-n):n}</text>`;}
  s+='<circle cx="184" cy="60" r="9" style="fill:var(--accent)"/><text x="184" y="40" text-anchor="middle" font-size="15" style="fill:var(--accent)">Vic −2 °C</text>';
  s+='<circle cx="424" cy="60" r="9" style="fill:var(--orange)"/><text x="424" y="40" text-anchor="middle" font-size="15" style="fill:var(--orange)">BCN 3 °C</text>';
  return s+'</svg>';
}
function treeFig(){
  const L=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-width="2"/>`;
  const T=(x,y,t,a)=>`<text x="${x}" y="${y}" font-size="16" fill="currentColor" dominant-baseline="middle" ${a?'text-anchor="'+a+'"':''}>${t}</text>`;
  let s='<svg viewBox="0 0 560 280" class="fig" role="img" aria-label="Diagrama d’arbre: 2 samarretes i 3 pantalons fan 6 combinacions.">';
  s+=T(10,140,'Roba');
  s+=L(60,140,170,70)+L(60,140,170,210);
  s+='<circle cx="182" cy="70" r="8" fill="#c0392b"/>'+T(196,70,'Vermella');
  s+='<circle cx="182" cy="210" r="8" fill="#2b6a8a"/>'+T(196,210,'Blava');
  const p=['Texans','Curts','Xandall'];
  [[70,[30,70,110]],[210,[170,210,250]]].forEach(([y0,ys])=>ys.forEach((y,i)=>{s+=L(290,y0,370,y)+T(378,y,p[i]);}));
  [30,70,110,170,210,250].forEach((y,i)=>{s+=T(545,y,(i+1)+'','end');});
  return s+'</svg>';
}
function triangleFig(){
  return `<svg viewBox="0 0 400 270" class="fig" style="max-width:400px" role="img" aria-label="Triangle rectangle amb catets 3 i 4 i hipotenusa 5.">
  <polygon points="60,220 300,220 60,40" fill="none" stroke="currentColor" stroke-width="3"/>
  <rect x="60" y="196" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="180" y="248" text-anchor="middle" font-size="18" fill="currentColor">catet = 4</text>
  <text x="48" y="135" text-anchor="end" font-size="18" fill="currentColor">catet = 3</text>
  <text x="200" y="118" font-size="18" style="fill:var(--orange)" font-weight="bold">hipotenusa = 5</text>
  <text x="92" y="212" font-size="14" fill="currentColor">90°</text></svg>`;
}
function gridFig(){
  const o=165,c=30;let s=`<svg viewBox="0 0 330 330" class="fig" style="max-width:360px" role="img" aria-label="Pla de coordenades amb el punt A a 3, 2 i el punt B a menys 2, menys 3.">`;
  for(let i=-5;i<=5;i++){const p=o+i*c;
    s+=`<line x1="${p}" y1="15" x2="${p}" y2="315" stroke="currentColor" stroke-opacity=".18"/><line x1="15" y1="${p}" x2="315" y2="${p}" stroke="currentColor" stroke-opacity=".18"/>`;
    if(i!==0){s+=`<text x="${p}" y="${o+18}" font-size="11" text-anchor="middle" fill="currentColor">${i<0?'−'+(-i):i}</text><text x="${o-8}" y="${o-i*c+4}" font-size="11" text-anchor="end" fill="currentColor">${i<0?'−'+(-i):i}</text>`;}
  }
  s+=`<line x1="15" y1="${o}" x2="318" y2="${o}" stroke="currentColor" stroke-width="2.5"/><line x1="${o}" y1="12" x2="${o}" y2="315" stroke="currentColor" stroke-width="2.5"/>`;
  s+=`<text x="320" y="${o-8}" font-size="16" text-anchor="end" fill="currentColor" font-weight="bold">x</text><text x="${o+8}" y="24" font-size="16" fill="currentColor" font-weight="bold">y</text>`;
  s+=`<line x1="${o}" y1="105" x2="255" y2="105" stroke="var(--accent)" stroke-dasharray="4 3"/><line x1="255" y1="${o}" x2="255" y2="105" stroke="var(--accent)" stroke-dasharray="4 3"/>`;
  s+=`<circle cx="255" cy="105" r="7" style="fill:var(--accent)"/><text x="263" y="98" font-size="16" style="fill:var(--accent)" font-weight="bold">A</text>`;
  s+=`<circle cx="105" cy="255" r="7" style="fill:var(--orange)"/><text x="88" y="250" font-size="16" style="fill:var(--orange)" font-weight="bold">B</text>`;
  s+=`<text x="${o+4}" y="${o+30}" font-size="11" fill="currentColor">origen (0, 0)</text>`;
  return s+'</svg>';
}
function barFig(){
  const d=[['Futbol',8],['Ball',6],['Bàsquet',5],['Natació',3]];
  let s='<svg viewBox="0 0 460 270" class="fig" style="max-width:460px" role="img" aria-label="Gràfic de barres dels esports preferits: futbol 8, ball 6, bàsquet 5, natació 3.">';
  for(let v=0;v<=8;v+=2){const y=220-v*22;s+=`<line x1="40" y1="${y}" x2="450" y2="${y}" stroke="currentColor" stroke-opacity=".15"/><text x="32" y="${y+5}" font-size="13" text-anchor="end" fill="currentColor">${v}</text>`;}
  d.forEach(([n,v],i)=>{const x=65+i*100,h=v*22;
    s+=`<rect x="${x}" y="${220-h}" width="60" height="${h}" rx="4" style="fill:var(--accent)"/><text x="${x+30}" y="${214-h}" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">${v}</text><text x="${x+30}" y="245" font-size="14" text-anchor="middle" fill="currentColor">${n}</text>`;});
  s+='<line x1="40" y1="220" x2="450" y2="220" stroke="currentColor" stroke-width="2"/><text x="10" y="14" font-size="13" fill="currentColor">Vots</text>';
  return s+'</svg>';
}
function tempFig(){
  const pts=[[8,10],[12,18],[16,20],[20,14]],X=h=>60+(h-8)*30,Y=t=>220-t*8;
  let s='<svg viewBox="0 0 460 270" class="fig" style="max-width:460px" role="img" aria-label="Gràfica de la temperatura: a les 8 hores 10 graus, a les 12 hores 18, a les 16 hores 20 i a les 20 hores 14.">';
  for(let t=0;t<=25;t+=5){s+=`<line x1="50" y1="${Y(t)}" x2="440" y2="${Y(t)}" stroke="currentColor" stroke-opacity=".15"/><text x="44" y="${Y(t)+5}" font-size="13" text-anchor="end" fill="currentColor">${t}°</text>`;}
  s+=`<polyline points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="none" stroke="var(--orange)" stroke-width="3"/>`;
  pts.forEach(p=>{s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="6" style="fill:var(--orange)"/><text x="${X(p[0])}" y="245" font-size="14" text-anchor="middle" fill="currentColor">${p[0]} h</text>`;});
  s+='<line x1="50" y1="220" x2="440" y2="220" stroke="currentColor" stroke-width="2"/><text x="250" y="266" font-size="13" text-anchor="middle" fill="currentColor">Hora del dia</text><text x="6" y="16" font-size="13" fill="currentColor">Temperatura</text>';
  return s+'</svg>';
}
function funcFigs(){
  const box=(path,lab,cap)=>`<figure><svg viewBox="0 0 160 130" class="fig" style="max-width:180px;margin:.2rem auto" role="img" aria-label="${cap}">
    <line x1="20" y1="110" x2="155" y2="110" stroke="currentColor" stroke-width="2"/><line x1="20" y1="110" x2="20" y2="5" stroke="currentColor" stroke-width="2"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3.5"/></svg><figcaption><b>${lab}</b><br>${cap}</figcaption></figure>`;
  return '<div class="figrow">'+
    box('M20,110 L150,15','Directa','Una puja, l’altra també puja.')+
    box('M30,10 Q45,95 150,104','Inversa','Una puja, l’altra baixa.')+
    box('M20,106 Q110,104 140,10','Exponencial','Creix cada cop més de pressa.')+'</div>';
}
function scatterFig(){
  const p=[[1,4],[2,5],[2,4.5],[3,6],[4,6.5],[4,7.5],[5,8],[6,8.5],[6,9.5]];
  let s='<svg viewBox="0 0 320 230" class="fig" style="max-width:340px" role="img" aria-label="Núvol de punts: com més hores d’estudi, més nota. Els punts pugen.">';
  s+='<line x1="40" y1="190" x2="310" y2="190" stroke="currentColor" stroke-width="2"/><line x1="40" y1="190" x2="40" y2="10" stroke="currentColor" stroke-width="2"/>';
  s+='<line x1="60" y1="150" x2="300" y2="20" stroke="var(--orange)" stroke-width="2" stroke-dasharray="6 4"/>';
  p.forEach(([h,n])=>{s+=`<circle cx="${40+h*42}" cy="${190-n*18}" r="6" style="fill:var(--accent)"/>`;});
  s+='<text x="175" y="220" font-size="13" text-anchor="middle" fill="currentColor">Hores d’estudi</text><text x="6" y="14" font-size="13" fill="currentColor">Nota</text>';
  return s+'</svg>';
}
const pascal=`<div class="pascal" aria-label="Triangle aritmètic">
<div><span>1</span></div><div><span>1</span><span>1</span></div><div><span>1</span><span>2</span><span>1</span></div>
<div><span>1</span><span>3</span><span>3</span><span>1</span></div><div><span>1</span><span>4</span><span>6</span><span>4</span><span>1</span></div></div>`;

/* =========================================================
   CONTINGUTS — Matemàtiques A, 4t ESO (Decret 175/2022)
   ========================================================= */
const UNITS=[
{id:'nombres',icon:'🔢',tri:1,title:'Els nombres',sub:'Enters, decimals i fraccions',
 goal:'Aprendré a <b>llegir</b>, <b>comparar</b> i <b>ordenar</b> nombres de la vida real.',
 why:'Els nombres surten als preus, a la temperatura i als resultats dels partits.',
 words:[['Nombre enter','Un nombre sense coma. Pot ser negatiu.','−3, 0, 5'],['Nombre decimal','Un nombre amb coma.','2,50 €'],['Fracció','Una part d’una cosa sencera.','1/2 = la meitat'],['Recta numèrica','Una línia amb els nombres en ordre.','−2 … 0 … 3']],
 how:['Els nombres <b>negatius</b> porten el signe <b>−</b>. Són més petits que 0.','A la recta numèrica, el nombre <b>més a la dreta</b> és el <b>més gran</b>.','Per comparar decimals, mira primer la part <b>abans de la coma</b>.','Si és igual, mira la xifra <b>després de la coma</b>.'],
 visual:numberLine(),

const KEY='mates4A_v1';
let S={fs:20,spaced:false,contrast:false,done:{},seen:{},feel:null};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function applyPrefs(){
  document.documentElement.style.setProperty('--fs',S.fs+'px');
  document.body.classList.toggle('spaced',S.spaced);
  document.body.classList.toggle('contrast',S.contrast);
  document.getElementById('bSpaced').setAttribute('aria-pressed',S.spaced);
  document.getElementById('bContrast').setAttribute('aria-pressed',S.contrast);
}
const STEPS=[['goal','🎯','Què aprendré'],['words','📖','Paraules clau'],['how','🪜','Com es fa'],['example','💡','Exemple'],['practice','✏️','Practico'],['remember','⭐','Recordo']];
const app=document.getElementById('app');
const doneCount=u=>{const d=S.done[u.id]||{};return u.ex.filter((_,i)=>d[i]).length;};

/* =========================================================
   VISTES
   ========================================================= */
function home(){
  const tri={1:'1r trimestre',2:'2n trimestre',3:'3r trimestre'};
  let h=`<section class="hello speak-zone"><h2>Hola! 👋</h2><p>Aquí aprendràs les matemàtiques de <b>4t d’ESO</b> pas a pas.</p>
  <p>Cada tema té sempre els mateixos <b>6 passos</b>:<br>🎯 Què aprendré · 📖 Paraules · 🪜 Com es fa · 💡 Exemple · ✏️ Practico · ⭐ Recordo</p>
  <p class="muted">Pots fer servir la calculadora. Pots anar al teu ritme. Equivocar-se és normal. 💚</p></section>`;
  h+=`<div class="tri"><h3>🧰 Les meves eines</h3><div class="grid"><a class="ucard" href="#eines"><span class="ic">💚</span><span><b>Com em sento i com treballo</b><small>Emocions i passos per fer problemes</small></span></a></div></div>`;
  [1,2,3].forEach(t=>{
    h+=`<div class="tri"><h3>📅 ${tri[t]}</h3><div class="grid">`;
    UNITS.filter(u=>u.tri===t).forEach(u=>{const n=doneCount(u),tot=u.ex.length;
      h+=`<a class="ucard" href="#u/${u.id}/0"><span class="ic">${u.icon}</span><span><b>${u.title}</b><small>${u.sub}</small><span class="prog">${n===tot?'⭐ Fet!':(n?'✔ '+n+' de '+tot:'')}</span></span></a>`;});
    h+='</div></div>';
  });
  h+=`<div class="tri"><h3>👩‍🏫 Per al docent</h3><div class="grid"><a class="ucard" href="#guia"><span class="ic">📋</span><span><b>Guia docent</b><small>Currículum, adaptacions i progrés</small></span></a></div></div>`;
  app.innerHTML=h;
}

function unit(id,step){
  const u=UNITS.find(x=>x.id===id); if(!u){location.hash='';return;}
  step=Math.max(0,Math.min(5,step|0));
  S.seen[u.id]=S.seen[u.id]||{};S.seen[u.id][step]=1;save();
  const idx=UNITS.indexOf(u);
  let h=`<div class="uhead"><span class="ic" aria-hidden="true">${u.icon}</span><div><span class="muted small">Tema ${idx+1} de ${UNITS.length}</span><h2 style="margin:0">${u.title}</h2></div></div>`;
  h+='<ol class="steps" aria-label="Passos del tema">'+STEPS.map((s,i)=>`<li><button data-go="${i}" class="${i===step?'cur':''} ${S.seen[u.id][i]?'seen':''}" ${i===step?'aria-current="step"':''}>${s[1]} ${s[2]}</button></li>`).join('')+'</ol>';
  h+=`<section class="panel speak-zone"><span class="stepnum">Pas ${step+1} de 6</span><h3 style="margin-top:0">${STEPS[step][1]} ${STEPS[step][2]}</h3>`;
  const k=STEPS[step][0];
  if(k==='goal') h+=`<p class="big">${u.goal}</p><p>🤔 <b>Per a què serveix?</b> ${u.why}</p>`;
  if(k==='words') h+='<div class="words">'+u.words.map(w=>`<div class="word"><b>${w[0]}</b>${w[1]}<br><span class="eg">Exemple: ${w[2]}</span></div>`).join('')+'</div>';
  if(k==='how') h+='<ol class="how">'+u.how.map(x=>`<li>${x}</li>`).join('')+'</ol>'+(u.visual||'');
  if(k==='example') h+=`<div class="example"><h3>💡 ${u.example.t}</h3><p>${u.example.b}</p></div>`+((u.id==='coordenades'||u.id==='comptar'||u.id==='pitagores')?u.visual:'');
  if(k==='practice'){
    h+=`<p>Fes els exercicis. Pots demanar una <b>pista</b> 💡. <span class="score" id="score">${doneCount(u)} de ${u.ex.length} ✔</span></p>`;
    if(['coordenades','funcions','estadistica'].includes(u.id)) h+=`<details><summary>👀 Veure el dibuix</summary>${u.visual}</details>`;
    h+='<div class="exs">'+u.ex.map((e,i)=>exHTML(u,e,i)).join('')+'</div>';
  }
  if(k==='remember') h+='<ul class="remember">'+u.remember.map(x=>`<li>✔ ${x}</li>`).join('')+`</ul><div class="fact"><b>🔎 Sabies que…?</b>${u.fact}</div>`+
    `<p style="margin-top:1rem">${doneCount(u)===u.ex.length?'⭐ <b>Has fet tots els exercicis. Molt bona feina!</b>':'Pots tornar a <b>✏️ Practico</b> quan vulguis.'}</p>`;
  h+='</section>';
  const prev=step>0?`#u/${u.id}/${step-1}`:'', next=step<5?`#u/${u.id}/${step+1}`:'';
  h+=`<div class="nav"><button class="btn sec" ${prev?'':'disabled'} data-href="${prev}">◀ Enrere</button>`+
     (next?`<button class="btn" data-href="${next}">Següent ▶</button>`:`<button class="btn" data-href="#">🏠 Tornar a l’inici</button>`)+'</div>';
  app.innerHTML=h;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>location.hash=`#u/${u.id}/${b.dataset.go}`);
  app.querySelectorAll('[data-href]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.href||'#';});
  if(k==='practice') bindEx(u);
}

function exHTML(u,e,i){
  const done=(S.done[u.id]||{})[i];
  let h=`<div class="ex ${done?'done':''}" id="ex${i}"><div class="q"><span class="n">${i+1}</span>${e.q}</div>`;
  if(e.t==='mc') h+='<div class="opts">'+e.o.map((o,j)=>`<button class="opt ${done&&j===e.a?'right':''}" data-i="${i}" data-j="${j}">${o}</button>`).join('')+'</div>';
  else h+=`<div class="numrow"><input type="text" inputmode="decimal" aria-label="Resposta ${i+1}" id="in${i}" ${done?'value="'+String(e.a).replace('.',',')+'"':''}>${e.u?'<span>'+e.u+'</span>':''}<button class="btn" data-check="${i}">Comprova</button></div>`;
  h+=`<div class="fb ${done?'ok':''}" id="fb${i}" aria-live="polite">${done?'✔ Correcte!':''}</div>`;
  h+=`<div class="hint" id="hi${i}">💡 ${e.h}</div><div class="hint" id="so${i}">📝 <b>Solució:</b> ${e.s}</div>`;
  h+=`<div class="links"><button class="linkbtn" data-hint="${i}">💡 Pista</button><button class="linkbtn" data-sol="${i}" ${done?'':'hidden'}>📝 Veure la solució</button></div></div>`;
  return h;
}
function parseNum(str){
  let s=String(str).trim().replace(/\s+/g,'').replace(/[€a-zA-Zº°²³%]+$/g,'').replace(/−/g,'-').replace(/,/g,'.');
  if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){const [a,b]=s.split('/').map(Number);return b?a/b:NaN;}
  return s===''?NaN:Number(s);
}
const OK=['Molt bé! ✔','Correcte! ✔','Ho has fet bé! ✔','Fantàstic! ✔'];
function bindEx(u){
  const tries={};
  const mark=(i,ok)=>{
    const fb=document.getElementById('fb'+i),box=document.getElementById('ex'+i);
    if(ok){fb.className='fb ok';fb.textContent=OK[i%OK.length];box.classList.add('done');
      S.done[u.id]=S.done[u.id]||{};S.done[u.id][i]=1;save();
      document.getElementById('score').textContent=doneCount(u)+' de '+u.ex.length+' ✔';
      box.querySelector('[data-sol]').hidden=false;
      if(doneCount(u)===u.ex.length) toast('⭐ Has acabat tots els exercicis!');
    }else{tries[i]=(tries[i]||0)+1;fb.className='fb no';
      fb.textContent=tries[i]===1?'Encara no. Torna-ho a provar. Pots mirar la pista 💡':'Encara no. Mira la solució i aprèn com es fa. 💚';
      if(tries[i]>=1) document.getElementById('hi'+i).classList.add('show');
      if(tries[i]>=2) box.querySelector('[data-sol]').hidden=false;}
  };
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,j=+b.dataset.j,e=u.ex[i];
    b.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('wrong'));
    if(j===e.a){b.classList.add('right');mark(i,true);}else{b.classList.add('wrong');mark(i,false);}
  });
  app.querySelectorAll('[data-check]').forEach(b=>{
    const i=+b.dataset.check,inp=document.getElementById('in'+i);
    const go=()=>{const e=u.ex[i],v=parseNum(inp.value);
      if(isNaN(v)){const fb=document.getElementById('fb'+i);fb.className='fb no';fb.textContent='Escriu un nombre, si us plau.';return;}
      mark(i,Math.abs(v-e.a)<=(e.tol||0.001));};
    b.onclick=go; inp.onkeydown=ev=>{if(ev.key==='Enter')go();};
  });
  app.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>document.getElementById('hi'+b.dataset.hint).classList.add('show'));
  app.querySelectorAll('[data-sol]').forEach(b=>b.onclick=()=>document.getElementById('so'+b.dataset.sol).classList.add('show'));
}

function eines(){
  const F={be:['😊','Estic bé','Genial! Comencem un tema. Recorda: un pas cada vegada.'],
    normal:['😐','Normal','D’acord. Comença per un exercici que ja saps fer, per escalfar.'],
    nervios:['😟','Nerviós / nerviosa','Fes 3 respiracions lentes amb el botó 🌿 Pausa. Després, només un exercici.'],
    bloquejat:['😣','Bloquejat / bloquejada','És normal. Para un moment. Demana ajuda al teu professor o professora amb la targeta 🆘. Mira la pista 💡.'],
    cansat:['🥱','Cansat / cansada','Fes una pausa curta. Després, repassa el pas ⭐ Recordo d’un tema.']};
  let h=`<section class="panel speak-zone"><h2>💚 Com em sento?</h2><p>Toca la cara que s’assembla més a com estàs ara.</p><div class="feel">`+
    Object.entries(F).map(([k,v])=>`<button data-feel="${k}" class="${S.feel===k?'sel':''}"><span style="font-size:1.6rem">${v[0]}</span><br>${v[1]}</button>`).join('')+
    `</div><p class="feelmsg" id="feelmsg" aria-live="polite">${S.feel?F[S.feel][2]:''}</p>
  <h2>🪜 Com faig un problema</h2><ol class="how"><li><b>Llegeixo</b> el problema a poc a poc. Dues vegades.</li><li><b>Subratllo</b> les dades (els nombres).</li><li>Em pregunto: <b>què em pregunten?</b></li><li><b>Trio</b> l’operació.</li><li><b>Calculo</b>. Puc fer servir la calculadora.</li><li><b>Comprovo</b>: el resultat té sentit?</li></ol>
  <h2>🧠 Recordo que…</h2><ul class="remember"><li>✔ Equivocar-me m’ajuda a aprendre.</li><li>✔ Puc demanar ajuda. 🆘</li><li>✔ Puc fer una pausa. 🌿</li><li>✔ Faig un pas cada vegada.</li><li>✔ Si una estratègia no funciona, en provo una altra.</li></ul>
  <h2>🤝 Treballar en equip</h2><ul><li>Escolto quan parla un company o companya.</li><li>Faig la meva part de la feina.</li><li>Puc dir «no ho entenc» o «ho pots repetir?».</li></ul></section>
  <div class="nav"><span></span><button class="btn" data-href="#">🏠 Tornar a l’inici</button></div>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-feel]').forEach(b=>b.onclick=()=>{S.feel=b.dataset.feel;save();
    app.querySelectorAll('[data-feel]').forEach(x=>x.classList.toggle('sel',x===b));
    document.getElementById('feelmsg').textContent=F[S.feel][2];});
  app.querySelector('[data-href]').onclick=()=>location.hash='#';
}

function guia(){
  let rows=UNITS.map((u,i)=>`<tr><td>${i+1}. ${u.icon} ${u.title}</td><td>${u.tri}r</td><td>${u.saber}</td><td>${doneCount(u)}/${u.ex.length}</td></tr>`).join('');
  app.innerHTML=`<section class="panel guide"><h2>📋 Guia docent</h2>
  <p>Material de <b>Matemàtiques A de 4t d’ESO</b> (Catalunya) adaptat per a un alumne amb <b>discapacitat intel·lectual lleu (DIL)</b> i <b>TEA</b> que rep suport a l’aula <b>SIEI</b>. Cal ajustar-lo al seu <b>Pla de suport individualitzat (PI)</b>.</p>

  <details open><summary>📚 Marc curricular</summary>
  <ul><li>Referent: <b>Decret 175/2022</b> d’ordenació dels ensenyaments de l’educació bàsica.</li>
  <li>A partir del <b>curs 2026-2027</b>, per la sentència 2859/2025 del TSJC, els centres han d’oferir a 4t <b>Matemàtiques A</b> o <b>Matemàtiques B</b>. Les dues tenen les mateixes competències específiques i criteris d’avaluació.</li>
  <li>Matemàtiques A (l’antiga opció d’«aplicades») prioritza la resolució de problemes i les situacions de la vida quotidiana.</li>
  <li>Matemàtiques B afegeix 3 sabers (marcats amb * al decret) que <b>no</b> s’inclouen aquí: raons trigonomètriques, expressions algebraiques de la recta i transformacions amb geometria analítica.</li>
  <li>El sentit socioemocional es treballa a «🧰 Les meves eines» i de forma transversal (feedback, pauses, error com a aprenentatge).</li></ul></details>

  <details><summary>🧩 Adaptacions aplicades a la pàgina</summary>
  <ul>
  <li><b>Estructura fixa i previsible</b> (6 passos idèntics a cada tema) i barra de progrés visible: anticipació i reducció de l’ansietat (principis TEACCH).</li>
  <li><b>Un pas per pantalla</b>: menys càrrega cognitiva i atencional.</li>
  <li><b>Lectura fàcil</b>: frases curtes, present, vocabulari explicat i exemples concrets.</li>
  <li><b>Vocabulari explícit</b> (📖 Paraules clau) abans del procediment.</li>
  <li><b>Suport visual coherent</b>: icones fixes, figures senzilles, fórmules ressaltades. Sense animacions ni imatges decoratives (evitar sobreestimulació).</li>
  <li><b>Contextos funcionals</b> de la vida diària (diners, compres, roba, plànols, transport) per afavorir la generalització.</li>
  <li><b>Retroacció immediata, positiva i no punitiva</b>; pista després del 1r error i solució guiada després del 2n. Sense temps límit.</li>
  <li><b>Calculadora permesa</b> en tots els temes.</li>
  <li><b>Accessibilitat</b>: mida de lletra, espaiat, alt contrast, lectura en veu alta (🔊) i botons grans.</li>
  <li><b>Autoregulació</b>: botó 🌿 Pausa (respiració) sempre visible i autoregistre emocional.</li>
  <li><b>Nivell de concreció</b>: els sabers de 4t es presenten en un nivell funcional, coherent amb una adaptació curricular significativa.</li></ul></details>

  <details><summary>🏫 Suggeriments per a l’aula SIEI</summary>
  <ul><li>Anticipar a l’inici de la sessió quin tema i quin pas es farà (agenda visual).</li>
  <li>Combinar amb material manipulable: monedes, cinta mètrica, daus, escuradents, geoplà.</li>
  <li>Aprofitar els interessos de l’alumne per canviar els contextos dels problemes.</li>
  <li>Fer servir el mateix vocabulari i els mateixos passos a l’aula ordinària i a l’aula SIEI.</li>
  <li>Avaluar segons els criteris prioritzats al PI; el comptador d’exercicis és orientatiu.</li>
  <li>Imprimir qualsevol pas amb Ctrl+P per fer fitxes en paper.</li></ul></details>

  <details open><summary>🗺️ Temes i sabers del currículum</summary>
  <div class="tablewrap"><table><tr><th>Tema</th><th>Trim.</th><th>Sabers (Decret 175/2022)</th><th>Fets</th></tr>${rows}
  <tr><td>🧰 Les meves eines</td><td>tots</td><td>Sentit socioemocional: creences, actituds i emocions; treball en equip i presa de decisions.</td><td>—</td></tr></table></div></details>

  <details><summary>🔗 Fonts consultades</summary>
  <ul class="small"><li>Departament d’Educació: <i>Canvis en el 4t curs de l’ESO per al curs 2026-2027</i> (abril 2026).</li>
  <li>Decret 175/2022, de 27 de setembre (DOGC 8762), sabers i criteris de 4t d’ESO.</li>
  <li>Protocols TEACCH i orientacions per a alumnat TEA (estructuració, informació visual, anticipació).</li>
  <li>Projectes SIEI de centres (bastides, comunicació visual i explícita, suport entre iguals).</li></ul></details>

  <p><button class="btn sec" id="bReset">🗑️ Esborrar el progrés d’aquest navegador</button></p></section>
  <div class="nav"><span></span><button class="btn" data-href="#">🏠 Tornar a l’inici</button></div>`;
  app.querySelector('[data-href]').onclick=()=>location.hash='#';
  document.getElementById('bReset').onclick=()=>{if(confirm('Segur que vols esborrar el progrés?')){S.done={};S.seen={};save();toast('Progrés esborrat.');guia();}};
}

/* =========================================================
   ENCAMINAMENT, EINES, VEU I CALMA
   ========================================================= */
function route(){
  stopSpeak();
  const h=location.hash.slice(1);
  if(h.startsWith('u/')){const [,id,st]=h.split('/');unit(id,+st||0);}
  else if(h==='guia') guia();
  else if(h==='eines') eines();
  else home();
  window.scrollTo(0,0); app.focus({preventScroll:true});
}
function toast(t){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}

const synth=window.speechSynthesis;
function stopSpeak(){try{synth&&synth.cancel();}catch(e){}}
function speak(){
  if(!synth){toast('Aquest navegador no pot llegir en veu alta.');return;}
  if(synth.speaking){stopSpeak();return;}
  const z=document.querySelector('.speak-zone'); if(!z) return;
  const txt=z.innerText.replace(/−/g,' menys ').replace(/×/g,' per ').replace(/ : /g,' dividit entre ').replace(/≈/g,' aproximadament ').replace(/√/g,' arrel de ').replace(/²/g,' al quadrat').replace(/³/g,' al cub').replace(/π/g,' pi ').replace(/≤/g,' menor o igual que ').replace(/≥/g,' major o igual que ');
  const ut=new SpeechSynthesisUtterance(txt); ut.lang='ca-ES'; ut.rate=.9;
  const v=synth.getVoices().find(x=>/^ca/i.test(x.lang)); if(v) ut.voice=v;
  synth.speak(ut);
}

let calmTimer=null;
function calm(on){
  const c=document.getElementById('calm'),t=document.getElementById('calmTxt');
  c.hidden=!on; clearInterval(calmTimer);
  if(on){stopSpeak();let inh=true;t.textContent='Inspira…';calmTimer=setInterval(()=>{inh=!inh;t.textContent=inh?'Inspira…':'Expira…';},4000);document.getElementById('bCalmOff').focus();}
}

document.getElementById('bHome').onclick=()=>location.hash='#';
document.getElementById('bBigger').onclick=()=>{S.fs=Math.min(30,S.fs+2);applyPrefs();save();};
document.getElementById('bSmaller').onclick=()=>{S.fs=Math.max(16,S.fs-2);applyPrefs();save();};
document.getElementById('bSpaced').onclick=()=>{S.spaced=!S.spaced;applyPrefs();save();};
document.getElementById('bContrast').onclick=()=>{S.contrast=!S.contrast;applyPrefs();save();};
document.getElementById('bSpeak').onclick=speak;
document.getElementById('bCalm').onclick=()=>calm(true);
document.getElementById('bCalmOff').onclick=()=>calm(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('calm').hidden)calm(false);});
window.addEventListener('hashchange',route);
applyPrefs(); route();
</script>
